[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "account-enum-detector"
version = "0.1.0"
description = "Authorized account-enumeration detection via status, body, header, and timing statistics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Security Testing Toolkit" }]
dependencies = []

[project.scripts]
account-enum-detector = "account_enum_detector.cli:main"

[tool.setuptools]
packages = ["account_enum_detector"]
